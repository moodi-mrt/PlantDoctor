# Shown with every chemical recommendation.
chemical_notice: >-
  Active ingredients are listed with their FRAC/IRAC resistance-management group so you can
  rotate modes of action. Use only a product that is registered in Pakistan for this crop and
  pest (registration is granted by the Department of Plant Protection, Ministry of National Food
  Security & Research). Dose, spray interval, pre-harvest interval (PHI), re-entry interval and
  protective equipment must be taken from the product label — this app does not provide doses.
  When in doubt, ask your district Agriculture Extension officer.

# Extension help — shown when a diagnosis is uncertain.
expert_help:
  - {name: "District Agriculture Extension office", note: "Free advice and field visits; ask for the plant protection officer. Punjab farmers can also call the Agriculture Department helpline 0800-17000 (as listed in its 2025 press releases).", url: "https://agripunjab.punjab.gov.pk/"}
  - {name: "Pakistan Agricultural Research Council (PARC)", url: "https://www.parc.gov.pk/"}
  - {name: "Central Cotton Research Institute, Multan (cotton)", url: "https://ccri.gov.pk/"}
  - {name: "Provincial plant pathology laboratories (Ayub Agricultural Research Institute, Faisalabad; Agriculture Research Institute Tarnab, Peshawar; ARI Tandojam, Sindh)"}
