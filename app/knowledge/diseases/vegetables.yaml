# ───────────── Onion ─────────────
Onion___Purple_blotch:
  name: Purple blotch
  kind: fungal
  pathogen: Alternaria porri
  parts: [leaves, seed stalks]
  symptoms: Small white sunken spots that enlarge into purple lesions with yellow margins and concentric rings; leaves collapse.
  causes: Fungus on debris; often follows thrips damage.
  conditions: Warm (21–30 °C), humid weather with dew.
  risk: {t: [21, 30], rh: 90, hours: 12}
  immediate:
    - "Protect foliage when lesions first appear; manage thrips."
  organic:
    - "Rotation; remove debris; wider spacing."
  chemical:
    - {ai: mancozeb, group: FRAC M03}
    - {ai: difenoconazole, group: FRAC 3}
    - {ai: azoxystrobin, group: FRAC 11}
  preventive:
    - "Rotation 3 years; healthy sets."
  refs: [ucipm_onion, pv_onion]

Onion___Stemphylium_leaf_blight:
  name: Stemphylium leaf blight
  kind: fungal
  pathogen: Stemphylium vesicarium (often with Colletotrichum spp.)
  parts: [leaves]
  symptoms: Small yellow-tan water-soaked spots that elongate and turn brown, often on the windward side of leaves.
  causes: Fungus on debris.
  conditions: Long leaf wetness; warm weather.
  risk: {t: [18, 28], rh: 90, hours: 12}
  immediate:
    - "Protect foliage when lesions appear."
  organic:
    - "Remove debris; rotation."
  chemical:
    - {ai: mancozeb, group: FRAC M03}
    - {ai: azoxystrobin + difenoconazole, group: FRAC 11 + 3}
  preventive:
    - "Rotation."
  refs: [ucipm_onion]

Onion___Iris_yellow_spot_virus:
  name: Iris yellow spot virus
  kind: viral
  pathogen: Iris yellow spot virus (orthotospovirus), spread by onion thrips
  parts: [leaves, seed stalks]
  symptoms: Straw-coloured, diamond-shaped lesions on leaves and seed stalks.
  causes: Thrips (Thrips tabaci) transmit the virus.
  conditions: Hot, dry weather favouring thrips.
  immediate:
    - "No cure; manage thrips."
  organic:
    - "Remove volunteer onions and weeds; blue sticky traps."
  chemical:
    - {ai: spinetoram (thrips), group: IRAC 5}
  preventive:
    - "Thrips management; rotation."
  refs: [ucipm_onion]

